title: WRENCH
tagline: Cyberinfrastructure Simulation Workbench
description: >-
  WRENCH is an open-source framework for building accurate, scalable, and
  reproducible simulators of parallel and distributed computing systems.
  Built on SimGrid, it lets researchers, educators, and developers prototype
  runtime systems and evaluate workflow, scheduling, storage, and energy
  strategies without access to a production platform.
url: "https://wrench-project.org"
