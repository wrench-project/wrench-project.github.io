<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fbfbfd" />

{%- assign page_desc = page.description | default: site.description -%}
<title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
<meta name="description" content="{{ page_desc | strip_newlines | strip }}" />
<meta name="keywords" content="WRENCH, simulation, SimGrid, cyberinfrastructure, scientific workflows, workflow management systems, HPC, distributed computing, simulator, batch scheduling, cloud, research software" />
<meta name="author" content="WRENCH Team" />
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!-- Open Graph / Twitter -->
<meta property="og:site_name" content="{{ site.title }}" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}" />
<meta property="og:description" content="{{ page_desc | strip_newlines | strip }}" />
<meta property="og:url" content="{{ page.url | absolute_url }}" />
<meta property="og:image" content="{{ '/images/logo-horizontal.png' | absolute_url }}" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ site.title }} · {{ site.tagline }}" />
<meta name="twitter:description" content="{{ page_desc | strip_newlines | strip }}" />
<meta name="twitter:image" content="{{ '/images/logo-horizontal.png' | absolute_url }}" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500&display=swap" />

<!-- Enables scroll-reveal only when JS is available (see .js-reveal in wrench.css) -->
<script>document.documentElement.classList.add('js-reveal');</script>

<!-- Styles -->
<link rel="stylesheet" href="/assets/css/wrench.css?v=3" />

<!-- Icons -->
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />

<!-- Structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareSourceCode",
  "name": "WRENCH",
  "alternateName": "WRENCH Cyberinfrastructure Simulation Workbench",
  "description": {{ site.description | strip_newlines | strip | jsonify }},
  "url": "{{ site.url }}",
  "codeRepository": "https://github.com/wrench-project/wrench",
  "programmingLanguage": "C++",
  "license": "https://www.gnu.org/licenses/lgpl-3.0.html",
  "author": { "@type": "Organization", "name": "The WRENCH Team" }
}
</script>

<!-- Global site tag (gtag.js) - Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YTMCRR0RD1"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-YTMCRR0RD1');
</script>
